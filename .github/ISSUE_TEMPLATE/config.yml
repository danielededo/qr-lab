# Configuration for the issue template chooser.
# Docs: https://docs.github.com/communities/using-templates-to-encourage-useful-issues-and-pull-requests

# Allow issues that don't fit a template (sensible default for small projects).
blank_issues_enabled: true

# Redirect non-issue conversations elsewhere.
contact_links:
  - name: Security report
    url: https://github.com/danielededo/qr-lab/security/policy
    about: Please report security issues privately — see SECURITY.md.
