# Dependabot base configuration.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# This template is language-agnostic, so only the GitHub Actions ecosystem is
# enabled (it applies to any repo with workflows). When the project picks a
# stack, add the matching ecosystem block — examples below.

version: 2

updates:
  # Keep GitHub Actions in workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      actions:
        patterns:
          - "*"

  # Each subproject manages its own requirements.txt.
  - package-ecosystem: "pip"
    directories:
      - "/wifi-qr"
      - "/totp-qr"
      - "/qr-damage"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    ignore:
      # numpy 2.5+ requires Python >=3.12; this project supports 3.11.
      # Drop this rule when the Python floor moves to 3.12.
      - dependency-name: "numpy"
        versions: [">=2.5"]
